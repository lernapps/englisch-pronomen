# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Wer tut es? I, you, he, she, it, we, they
description: Du lernst die Pronomen, mit denen du sagst, wer etwas tut, und wählst he, she oder it nach der Person oder Sache.
competencies: [personalpronomen]
scope: Die Seite führt die erste Spalte der Pronomen-Tabelle ein, „Wer tut es?“. Pronomen als Subjekt stehen vor dem Verb und ersetzen die Person oder Sache, die etwas tut. Es sind I (ich), you (du oder ihr), he (er, für einen Jungen oder Mann), she (sie, für ein Mädchen oder eine Frau), it (es, für Dinge und Tiere), we (wir) und they (sie, mehrere). Die Beispiele nutzen can mit swim, run, sing, jump und read, weil can in allen Personen gleich bleibt. Typische Fehler sind me statt I (Me can swim.) und it für eine Person.
blocks:
  - type: section
    id: einstieg
    title: Sports day in Millbrook
    blocks:
      - type: figure
        image: images/szene-wer-tut-es.svg
        alt: Sophie, Ellie, Peter und Amir stehen im Klassenzimmer, rechts steht Mr Hill. An der Tafel steht Sports day und die Wörter swim, run, sing, jump, read.
        caption: Von links nach rechts Sophie, Ellie, Peter, Amir und Mr Hill. An der Tafel stehen die Wörter für den Sports day, das Sportfest der Schule.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: |
          Morgen ist Sports day an der Millbrook School, das Sportfest. Sophie (11) aus Deutschland wohnt bei der Familie Parker. Sie steht mit Ellie Parker (11), Ellies Bruder Peter (9) und ihrem Freund Amir (11) bei Mr Hill, dem Englischlehrer. Er fragt, wer was kann. Ellie sagt: „I can swim.“ Das heißt: „Ich kann schwimmen.“ **can** heißt „kann“, **swim** heißt „schwimmen“.
      - type: text
        text: "**Das kannst du danach:** Du sagst auf Englisch, wer etwas tut, und wählst das passende Wort: I, you, he, she, it, we oder they."
      - type: single-choice
        id: wer-start
        text: Ellie sagt „I can swim.“ Wer kann schwimmen?
        options:
          - text: Ellie
            correct: true
            info: I heißt „ich“. Mit I meint die sprechende Person sich selbst, hier also Ellie.
          - text: Mr Hill
            correct: false
            info: Mr Hill hat den Satz nicht gesagt. Mit I meint man immer die Person, die spricht.
          - text: Alle Kinder
            correct: false
            info: Für mehrere Personen nimmst du ein anderes Wort. I meint nur eine Person.
        explanation: I steht für die Person, die spricht.
        links:
          - title: Personalpronomen (Wikipedia)
            url: https://de.wikipedia.org/wiki/Personalpronomen
  - type: section
    id: neu
    title: Welches Wort sagt, wer es tut?
    blocks:
      - type: text
        text: |
          Du sagst nicht jedes Mal „Ellie can swim, Ellie can run“. Du ersetzt den Namen durch ein kurzes Wort. Das Wort heißt **Pronomen**. Das Wort, das sagt, wer etwas tut, steht vor dem Verb. Das ist die erste Frage der Tabelle auf dem Poster, das Sophie in der Klasse aufhängt: **Wer tut es?** Links steht das deutsche Wort, rechts das englische Pronomen.
      - type: table
        caption: Klassenzimmer-Poster · Pronomen
        header: [Person, Wer tut es?]
        rowHeaders: true
        rows:
          - [ich, I]
          - [du / ihr, you]
          - [er, he]
          - [sie (ein Mädchen), she]
          - [es, it]
          - [wir, we]
          - [sie (mehrere), they]
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              **he** sagst du für einen Jungen oder Mann, **she** für ein Mädchen oder eine Frau. **it** ist für Dinge und Tiere, nie für eine Person. **you** gilt für eine Person (du) und für mehrere (ihr). **we** ist „ich und andere zusammen“. Beispiele: You can read. He can swim. She can sing. We can jump. They can run. **can** heißt „kann“ und bleibt bei jeder Person gleich.
      - type: text
        text: "Die Wörter auf der Tafel: **swim** (schwimmen), **run** (rennen, laufen), **sing** (singen), **jump** (springen), **read** (lesen)."
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: matching
        id: wer-zuordnen
        text: Welches Pronomen ersetzt die Person oder Sache?
        pairs:
          - left: Peter (ein Junge)
            right: he
          - left: Ellie (ein Mädchen)
            right: she
          - left: Amir und Ellie
            right: they
          - left: Sophie sagt über sich und Ellie
            right: we
          - left: Sophie sagt über sich
            right: I
        distractors: [it]
        explanation: Das Pronomen folgt der Person. he ist für einen Jungen, she für ein Mädchen, they für mehrere Personen, we, wenn die sprechende Person dazugehört.
        hint: Frag dich, ob die Person ein Junge oder ein Mädchen ist, ob es mehrere sind und ob die sprechende Person dazugehört.
        links:
          - title: Lernlandkarte Englisch · Personalpronomen
            url: https://lernapps.net/apps/map/englisch/c/personalpronomen/
      - type: language-task
        id: wer-waehlen
        languages: { source: de, target: en }
        mode: choice
        task: Wähle das Pronomen, das sagt, wer es tut.
        form: { case: hint, punctuation: hint }
        items:
          - cue: Peter kann rennen.
            target: "[He] can run."
            distractors: [[She, It]]
            mistakes:
              - answer: She can run.
                message: she ist für ein Mädchen oder eine Frau. Peter ist ein Junge, also he.
              - answer: It can run.
                message: it ist für Dinge und Tiere. Für einen Jungen wie Peter sagst du he.
          - cue: Ellie kann lesen.
            target: "[She] can read."
            distractors: [[He, Her]]
            mistakes:
              - answer: He can read.
                message: Ellie ist ein Mädchen, also she.
              - answer: Her can read.
                message: Für Ellie sagst du she.
          - cue: "Sophie sagt: „Ich kann singen.“"
            target: "[I] can sing."
            distractors: [[Me]]
            mistakes:
              - answer: Me can sing.
                message: Wer selbst etwas tut, sagt I.
          - cue: Amir und Peter können springen.
            target: "[They] can jump."
            distractors: [[He, We]]
            mistakes:
              - answer: He can jump.
                message: Amir und Peter sind mehrere, also they.
              - answer: We can jump.
                message: Über Amir und Peter sagst du they.
      - type: language-task
        id: wer-schreiben
        languages: { source: de, target: en }
        task: Schreibe den Satz auf Englisch.
        form: { case: hint, punctuation: hint }
        items:
          - source: Ich kann rennen.
            target: I can run.
            mistakes:
              - answer: I run.
                message: Du brauchst auch can. Es heißt „kann rennen“, also can run.
              - answer: Me can run.
                message: Wer etwas tut, sagt I. me kommt erst später.
          - source: Er kann lesen. (Peter)
            target: He can read.
            mistakes:
              - answer: He read.
                message: Du brauchst auch can. Es heißt „kann lesen“, also can read.
              - answer: She can read.
                message: she ist für ein Mädchen oder eine Frau. Für einen Jungen sagst du he.
          - source: Wir können singen.
            target: We can sing.
            mistakes:
              - answer: You can sing.
                message: you heißt „du“ oder „ihr“. Wenn du selbst dazugehörst, sagst du we.
          - source: Sie (Ellie und Amir) können schwimmen.
            target: They can swim.
            mistakes:
              - answer: She can swim.
                message: she meint nur ein Mädchen. Bei mehreren Personen sagst du they.
      - type: true-false
        id: wer-it
        text: Peter kann springen. Auf Englisch sagst du dann „It can jump.“ Stimmt das?
        answer: false
        hint: Schau in den Kasten „Merke“. Für wen ist it da?
        explanation: it ist für Dinge und Tiere. Für Peter sagst du he.
        links:
          - title: Personalpronomen (Wikipedia)
            url: https://de.wikipedia.org/wiki/Personalpronomen
      - type: language-task
        id: wer-hoeren
        languages: { source: de, target: en }
        task: Hör zu und schreibe, was du hörst.
        form: { case: hint, punctuation: hint }
        items:
          - audio: she-can-run.mp3
            target: She can run.
          - audio: they-can-sing.mp3
            target: They can sing.
          - audio: we-can-swim.mp3
            target: We can swim.
      - type: language-task
        id: wer-tabelle
        languages: { source: de, target: en }
        mode: table
        task: Ergänze die Spalte „Wer tut es?“ ohne nachzusehen.
        form: { case: hint }
        table:
          caption: Klassenzimmer-Poster · Pronomen
          header: [Person, Wer tut es?]
          rows:
            - [ich, "[I]"]
            - [er, "[he]"]
            - [sie (ein Mädchen), "[she]"]
            - [wir, "[we]"]
            - [sie (mehrere), "[they]"]
  - type: section
    id: anwenden
    title: Selbst sagen
    blocks:
      - type: speaking-task
        id: wer-nachsprechen
        language: en
        items:
          - audio: i-can-read.mp3
            text: I can read.
          - audio: he-can-jump.mp3
            text: He can jump.
          - audio: you-can-swim.mp3
            text: You can swim.
        hint: Hör das Beispiel zuerst. Sprich dann langsam nach und vergleiche deine Aufnahme mit dem Original.
  - type: section
    id: weiter
    title: Wie es weitergeht
    blocks:
      - type: text
        text: Auf dem Poster steht die erste Spalte. Beim Üben für den Sports day wirft Sophie Peter den Ball zu. Auf der nächsten Seite lernst du, welche Form du brauchst, wenn jemand gesehen, gerufen oder getroffen wird.
