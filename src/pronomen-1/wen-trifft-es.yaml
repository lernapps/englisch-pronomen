# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Wen trifft es? me, you, him, her, it, us, them
description: Du lernst die Pronomen, mit denen du sagst, wen etwas trifft, und erkennst den Unterschied zu I, he, she, we, they.
competencies:
  - personalpronomen
scope: Die Seite führt die zweite Spalte der Pronomen-Tabelle ein, „Wen trifft es?“. Pronomen als Objekt stehen nach dem Verb und sagen, wen oder was die Handlung trifft. Es sind me (mich), you (dich oder euch), him (ihn), her (sie, ein Mädchen), it (es), us (uns) und them (sie, mehrere). you und it sehen in beiden Spalten gleich aus. Die Beispiele nutzen can mit see, help und call. Typische Fehler sind ein Pronomen der ersten Spalte nach dem Verb (can see I, can see he) und ein Pronomen der zweiten Spalte vor dem Verb (Me can see).
blocks:
  - type: section
    id: einstieg
    title: Sophie wirft den Ball
    blocks:
      - type: figure
        image: images/szene-wen-trifft-es.svg
        alt: Auf dem Sportplatz wirft Sophie einen Ball im Bogen zu Peter. Ellie und Amir stehen in der Mitte.
        caption: Sophie (links) wirft den Ball zu Peter (rechts). Ellie und Amir stehen in der Mitte.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: |
          Beim Üben für den Sports day ruft Peter: „Sophie can see me.“ Das heißt: „Sophie kann mich sehen.“ **see** heißt „sehen“, **help** „helfen“ und **call** „rufen“, **find** „finden“ und **hear** „hören“. Auch **him** (ihn), **us** (uns) und **them** (sie, mehrere) lernst du gleich.
      - type: text
        text: "**Das kannst du danach:** Du sagst auf Englisch, wen oder was etwas trifft, und wählst me, you, him, her, it, us oder them."
      - type: single-choice
        id: wen-start
        text: "Ellie sagt: „Amir can find me.“ Wen kann Amir finden?"
        options:
          - text: Ellie
            correct: true
            info: me heißt „mich“. Ellie sagt den Satz, also ist sie die, die Amir finden kann.
          - text: Amir
            correct: false
            info: Amir kann etwas finden, aber er ist nicht der, der gefunden wird.
          - text: Sophie
            correct: false
            info: Sophie kommt im Satz nicht vor. me meint die Person, die den Satz sagt.
        explanation: me meint die Person, die spricht. Es sagt, wen die Handlung trifft.
        links:
          - title: Personalpronomen (Wikipedia)
            url: https://de.wikipedia.org/wiki/Personalpronomen
  - type: section
    id: neu
    title: Welches Wort sagt, wen es trifft?
    blocks:
      - type: text
        text: |
          In „Sophie can see me“ tut Sophie etwas, und es trifft Peter. Auf der ersten Seite („Wer tut es?“) hast du die Wörter gelernt, die sagen, **wer es tut**. Dazu kommt die zweite Frage der Tabelle: **Wen trifft es?** Dieses Wort steht nach dem Verb. Die Wörter der ersten Spalte heißen Subjekt-Pronomen, die der zweiten Objekt-Pronomen.
      - type: table
        caption: Klassenzimmer-Poster · Pronomen
        header:
          - Person
          - Wer tut es?
          - Wen trifft es?
        rowHeaders: true
        rows:
          - - ich
            - I
            - me
          - - du / ihr
            - you
            - you
          - - er
            - he
            - him
          - - sie (ein Mädchen)
            - she
            - her
          - - es
            - it
            - it
          - - wir
            - we
            - us
          - - sie (mehrere)
            - they
            - them
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              Wer etwas tut, sagt **I**, **he**, **she**, **we**, **they**. Wen es trifft, sagt **me**, **him**, **her**, **us**, **them**. **you** und **it** sehen in beiden Spalten gleich aus. Beispiele: He can hear us. We can hear them. You can hear him. Auch bei help steht him, obwohl wir im Deutschen „ihm“ sagen.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: matching
        id: wen-zuordnen
        text: Sophie ruft Ellie, Peter und Amir etwas zu. Welches Wort sagt, wen es trifft?
        pairs:
          - left: Ellie sagt über sich selbst, dass Sophie sie sehen kann.
            right: me
          - left: Sophie sagt über Peter, dass Ellie ihm helfen kann.
            right: him
          - left: Sophie sagt über Ellie, dass Peter sie rufen kann.
            right: her
          - left: Sophie sagt über sich und Ellie, dass Amir ihnen helfen kann.
            right: us
          - left: Sophie sagt über Amir und Peter, dass Ellie sie sehen kann.
            right: them
        explanation: Das Wort folgt der Person, die etwas trifft. Zu jedem Pronomen der ersten Spalte gibt es eines für die zweite Spalte, und das Muster ist nicht überall gleich.
        hint: Frag dich, wen es trifft, und ob die Person ein Junge, ein Mädchen oder mehrere sind.
        links:
          - title: Lernlandkarte Englisch · Personalpronomen
            url: https://lernapps.net/apps/map/englisch/c/personalpronomen/
      - type: single-choice
        id: wen-waehlen-2
        text: Ellie kann ihm (Peter) helfen. Welches Wort fehlt? „Ellie can help ___.“
        options:
          - text: he
            correct: false
            info: he sagt, wer es tut. Wen es trifft, sagst du mit him.
          - text: her
            correct: false
            info: her ist für ein Mädchen. Peter ist ein Junge, also him.
          - text: him
            correct: true
            info: him ist für einen Jungen oder Mann und steht nach dem Verb.
        explanation: Für Peter, einen Jungen, sagst du him.
        links:
          - title: Personalpronomen (Wikipedia)
            url: https://de.wikipedia.org/wiki/Personalpronomen
      - type: single-choice
        id: wen-waehlen-3
        text: "Ellie sagt: „Mr Hill kann uns sehen.“ Welches Wort fehlt? „Mr Hill can see ___.“"
        options:
          - text: them
            correct: false
            info: them meint andere. Ellie gehört selbst dazu, also us.
          - text: us
            correct: true
            info: us meint die sprechende Person und andere.
          - text: we
            correct: false
            info: we sagt, wer etwas tut. Wen es trifft, sagst du mit us.
        explanation: Wenn die sprechende Person dazugehört, sagst du us.
        links:
          - title: Personalpronomen (Wikipedia)
            url: https://de.wikipedia.org/wiki/Personalpronomen
      - type: ordering
        id: wen-ordnen
        text: Bring die Wörter in die richtige Reihenfolge, damit der Satz stimmt.
        items:
          - Peter
          - can
          - help
          - them
        explanation: Zuerst kommt, wer etwas tut, dann can, dann das Verb und zuletzt, wen es trifft.
        hint: Wer tut es? Das steht am Anfang. Wen trifft es? Das steht am Ende.
        links:
          - title: Personalpronomen (Wikipedia)
            url: https://de.wikipedia.org/wiki/Personalpronomen
      - type: language-task
        id: wen-schreiben
        languages:
          source: de
          target: en
        task: Schreibe den Satz auf Englisch.
        form:
          case: hint
          punctuation: hint
        items:
          - source: Ich kann dich sehen.
            target: I can see you.
            mistakes:
              - answer: Me can see you.
                message: Wer etwas tut, sagt I. me steht nur nach dem Verb.
          - source: Ellie kann ihn sehen. (Peter)
            target: Ellie can see him.
            mistakes:
              - answer: Ellie can see he.
                message: he sagt, wer es tut. Es trifft Peter, also him.
          - source: Peter kann sie rufen. (Ellie)
            target: Peter can call her.
            mistakes:
              - answer: Peter can call she.
                message: she sagt, wer es tut. Es trifft Ellie, also her.
          - source: Ellie und Amir können uns helfen.
            target: (They|Ellie and Amir) can help us.
            mistakes:
              - answer: Them can help us.
                message: them sagt, wen es trifft. Wer es tut, sagst du mit they.
      - type: true-false
        id: wen-falsch
        text: Sophie sagt „Peter can see I.“ Ist der Satz richtig?
        answer: false
        hint: Steht I vor dem Verb oder nach dem Verb? Wohin gehört es laut Tabelle?
        explanation: I sagt, wer etwas tut. Nach dem Verb steht me.
        links:
          - title: Personalpronomen (Wikipedia)
            url: https://de.wikipedia.org/wiki/Personalpronomen
      - type: language-task
        id: wen-hoeren
        languages:
          source: de
          target: en
        task: Hör zu und schreibe, was du hörst.
        form:
          case: hint
          punctuation: hint
        items:
          - audio: sophie-can-help-you.mp3
            target: Sophie can help you.
          - audio: peter-can-see-us.mp3
            target: Peter can see us.
          - audio: ellie-can-see-them.mp3
            target: Ellie can see them.
      - type: language-task
        id: wen-tabelle
        languages:
          source: de
          target: en
        mode: table
        task: Ergänze die Spalte „Wen trifft es?“ ohne nachzusehen.
        form:
          case: hint
        table:
          caption: Klassenzimmer-Poster · Pronomen
          header:
            - Person
            - Wer tut es?
            - Wen trifft es?
          rows:
            - - ich
              - I
              - "[me]"
            - - er
              - he
              - "[him]"
            - - sie (ein Mädchen)
              - she
              - "[her]"
            - - wir
              - we
              - "[us]"
            - - sie (mehrere)
              - they
              - "[them]"
  - type: section
    id: anwenden
    title: Selbst sagen
    blocks:
      - type: speaking-task
        id: wen-nachsprechen
        language: en
        items:
          - audio: amir-can-help-her.mp3
            text: Amir can help her.
          - audio: we-can-see-him.mp3
            text: We can see him.
          - audio: they-can-call-me.mp3
            text: They can call me.
        hint: Hör das Beispiel zuerst. Sprich dann langsam nach und vergleiche deine Aufnahme mit dem Original.
  - type: section
    id: weiter
    title: Wie es weitergeht
    blocks:
      - type: text
        text: Auf dem Poster stehen jetzt zwei Spalten. Nach dem Üben stehen die Taschen der Kinder im Flur. Auf der nächsten Seite lernst du die dritte Frage der Tabelle, **Zu wem gehört es?**
