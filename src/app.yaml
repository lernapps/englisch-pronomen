format: 2
strand: englisch/grammatik
title: "Pronomen: I, me, my, mine, myself"
intro: Sophie wohnt bei den Parkers und geht in Millbrook zur Schule. Du hilfst ihr herauszufinden, welche Form eines Pronomens sie braucht – je nachdem, wer etwas tut, wen es trifft und wem etwas gehört. Eine Tabelle wächst mit dir mit. Dieses Kapitel behandelt I, me, my und die Formen für he, she, it, we und they. Mehr folgt in einem späteren Kapitel.
languages: [de]
chapters: [pronomen-1]
scope:
  text: Die App begleitet Kinder der Klassen 5 und 6. Kapitel 1 stellt die Pronomen-Tabelle vor. Spalte 1 „Wer tut es?“ hat I, you, he, she, it, we, they. Spalte 2 „Wen trifft es?“ hat me, you, him, her, it, us, them. Spalte 3 „Wessen Ding?“ hat my, your, his, her, its, our, their. Die Kinder lernen, dass man he oder she nach der Person wählt, it für Dinge und Tiere, und dass his und her sich nach dem Besitzer richten, nicht nach dem Ding.
  out:
    - mine, yours, myself und each other (kommen in Kapitel 2)
    - this, that, some, any und ihre Zusammensetzungen
    - Relativpronomen
    - die Formen von to be
    - Bewertung der Aussprache durch die App
